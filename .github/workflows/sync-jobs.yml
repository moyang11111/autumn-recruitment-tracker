name: Sync public recruitment jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: recruitment-job-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests before fetching
        run: npm test

      - name: Sync public job snapshot
        run: node scripts/sync-jobs.mjs --write-if-changed

      - name: Commit changed snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/jobs.generated.json data/jobs.generated.js; then
            echo "No recruitment snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.generated.json data/jobs.generated.js
          git commit -m "chore: sync recruitment jobs"
          git push
